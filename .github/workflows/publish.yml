name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    if: github.repository == 'johnasblasco/vibe-code' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Reverified 2026-11-02; see specs/013-github-npm/research.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate release identity, pack and smoke-test the artifact
        id: package
        run: npm run release:prepare
      - name: Publish the verified tarball using npm OIDC
        run: npm publish "$RELEASE_TARBALL" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
        env:
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
