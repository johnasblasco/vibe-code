schema: interview-ui/v1
command_name: vibecode
title: Vibecode idea interview
banner: |2-
         _ _                         _
   __   _(_) |__   ___  ___ ___   __| | ___
   \ \ / / | '_ \ / _ \/ __/ _ \ / _` |/ _ \
    \ V /| | |_) |  __/ (_| (_) | (_| |  __/
     \_/ |_|_.__/ \___|\___\___/ \__,_|\___|
tagline: From idea to a clear next step.
welcome: Let's shape your project. Start simple; you can decide more later.
welcome_back: Welcome back. Let's continue where you left off.
session_help: Enter to continue. /defer for later. Ctrl+C to pause.
section_details: A little more detail
section_review: Recommended defaults
question_progress: '{number}. {question}'
menu_rows: '7'
review_hint: Space toggles a recommendation. Enter keeps your selection; anything unchecked is asked individually.
next_steps_title: Your next steps
next_steps: |-
  vibecode doctor          Check your development setup
  vibecode generate        Preview project files
  vibecode generate --write  Review and confirm writing files
  Missing details are asked before generation. Existing files stay safe.
paused: Paused.
value_pick_for_me: Recommend for me
value_auto_detect: Detect automatically
help: Show command help
usage: Usage
options: Options
commands: Commands
init: Start or resume the idea interview
next: Resume the saved idea interview
state_option: Path to the local state file
state: How would you like to record this answer?
answered: Answer now
deferred: Decide later
not_applicable: Doesn't apply
yes: Yes
no: No
owner: Who owns this deferred answer?
revisit: When or after what event should it be revisited?
reason: Why does this question not apply?
defer_command: /defer
na_command: /na
direct_hint: '/defer = decide later; /na = does not apply'
why: Why this matters
required: Enter a nonempty answer.
number: Enter a finite number.
invalid: The answer was not accepted. Check its type and allowed values, and remove any credentials.
review: Keep these defaults?
source: Source
source_question: Built-in default
verified: Verified
bank_change: The question bank or knowledge packs changed. Affected questions need review; saved progress does not verify gates.
cancelled: Progress saved. Run vibecode next to resume.
completed: Your project brief is ready. Let's take the next step.
blocked: Resolve the displayed blocking contradictions before proceeding.
stop: Interview stopped. Follow the displayed expert guidance before proceeding.
terminal_required: An interactive terminal is required for the interview. Use --help to view commands.
missing_state: No saved interview was found. Run init first.
error: Unable to continue. Check the kit, state file, directory permissions, and selected stage. Existing answers were not reset.
usage_error: Invalid command or option. Use --help to view supported commands.
premortem: Rank applicable failures and create docs/risk-register.md
gates: Check a course boundary or applicable named gate
gate_argument: Gate ID from the golden path or loaded question modules
project_option: Existing project directory for the risk register
top_option: Maximum number of ranked failures to display
dry_run_option: Preview the risk register without writing files
deferrals_option: Explicit gate-deferrals YAML file for this evaluation only
risk_written: Created docs/risk-register.md. Review open rows and assign owners and revisit triggers, or record acceptance with a reason.
risk_error: Unable to create the register. Check required answers, bindings, directory permissions, and whether docs/risk-register.md already exists. Existing reports are never overwritten.
gate_error: Unable to check this gate. Check that the gate applies and that explicit deferrals have an owner, reason, and revisit trigger.
invalid_top: Choose a positive whole number of risks.
generate: Preview or explicitly write files from the output manifest and bindings
file_option: Select an applicable output ID; repeat to select more files
offline_option: Use dated verified pack pins without making network requests
write_option: Request writing after preview and typed confirmation in an interactive terminal
contact_option: Reporting email or HTTPS URL for SECURITY.md; never enter credentials
generation_project_option: Existing target directory for generated project files
generation_dry_run_option: Preview generated project files without publishing them
doctor: Run current readiness checks for beginner stages 0 to 2
doctor_stage_option: Source course stage to check; stage-0, stage-1, or stage-2
doctor_project_option: Existing local development project directory
doctor_dry_run_option: Show planned checks without running processes, probes, or network requests
probe_option: Request an isolated guarded scanner proof after typed consent
attest_option: Ask and record current manual confirmations in an interactive terminal
preview_url_option: Explicit nonproduction public HTTPS preview URL; never a production URL
expected_version_option: Nonsecret version text expected in the preview response
repository_option: Public GitHub owner/repository for the current commit's CI check
nonproduction_option: Designate the preview as nonproduction; typed consent is still required
verify_option: Run supported current doctor checks instead of inspection only
course_option: View the beginner course separately from the idea interview
advance_option: Advance one course boundary only after fresh checks pass
