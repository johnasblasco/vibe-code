schema: step-card/v1
cards:
  - id: git.init_ignore
    stage: stage-1
    audience: beginner
    teach: "Git saves every version of your project so you can undo mistakes. The .gitignore file lists files Git must never save, like your secret keys. Make it before any secret exists."
    do:
      - run: "git init"
      - write: ".gitignore (includes .env, .env.*, node_modules, build output; excludes .env.example)"
      - run: "git add . && git commit -m 'chore: initial commit'"
    verify:
      - {auto: "git rev-parse HEAD succeeds"}
      - {auto: "git check-ignore .env confirms .env is ignored"}
    if_fails:
      - {match: "Please tell me who you are", say: "Run the two git config commands shown, using your name and email, then retry."}
    gate: blocks(stage-2)
    undo: "Deleting the hidden .git folder removes all version history (macOS/Linux: rm -rf .git; Windows PowerShell: Remove-Item -Recurse -Force .git). Only do this on a brand new project."
    covers: [beginner-ops:secrets-hygiene, arc42:architecture-decisions]
  - id: git.secret_scanner
    stage: stage-1
    audience: beginner
    teach: "AI-written code leaks secrets more often than people expect. A scanner blocks a commit that contains a key, before it ever leaves your computer."
    do:
      - run: "install a secret scanner as a pre-commit hook"
      - run: "create a test file containing a fake key and try to commit it"
    verify:
      - {auto: "the commit containing the fake key is refused"}
      - {auto: "the fake file is removed afterwards"}
    if_fails:
      - {match: "hook did not run", say: "Run the hook install command again from the project root."}
    gate: blocks(stage-2)
    undo: "Remove the hook file in .git/hooks. Not recommended."
    covers: [beginner-ops:secrets-hygiene, owasp-top10-2025:supply-chain-failures]
