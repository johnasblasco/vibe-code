schema: step-card/v1
cards:
  - id: env.config_secrets
    stage: stage-3
    audience: beginner
    teach: "Settings and secrets go in environment variables, not in code. Your local app and your live app use different values so a mistake on your computer cannot damage real data."
    do:
      - write: ".env.example listing every variable with a fake value"
      - run: "copy .env.example to .env and fill in real local values"
      - say: "Add the same variable names, with production values, in the host dashboard."
      - write: "a startup check that stops the app with a clear message when a required variable is missing"
    verify:
      - {auto: "removing a required variable makes the app stop with a readable message"}
      - {auto: "no secret value appears in the browser bundle"}
      - {auto: "git shows .env is not tracked"}
    if_fails:
      - {match: "variable undefined in browser", say: "Browser code can only see variables with the framework's public prefix. Never give a secret that prefix."}
    gate: blocks(stage-4)
    undo: "Delete the variable in the dashboard or .env. Rotate any secret that was ever committed."
    covers: [asvs:configuration, beginner-ops:secrets-hygiene, owasp-top10-2025:security-misconfiguration]
