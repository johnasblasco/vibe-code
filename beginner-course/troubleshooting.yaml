# Used by `scaffold stuck`. The CLI matches the error text, shows the plain explanation and fix, and offers a redacted diagnostics block.
schema: troubleshooting/v1
redaction_rules: "Before showing or copying any diagnostics: remove .env contents, tokens, passwords, connection strings, emails, and absolute home paths. Show the user the redacted text first and let them approve."
entries:
  - {id: cmd-not-found, match: "command not found|is not recognized as an internal or external command", plain: "The tool is not installed, or this terminal was opened before it was installed.", fix: "Install it from its official site, close the terminal, open a new one, and try again."}
  - {id: docker-not-running, match: "Cannot connect to the Docker daemon|docker daemon is not running", plain: "Docker is installed but not running.", fix: "Open the Docker Desktop app and wait until it says it is running."}
  - {id: port-in-use, match: "EADDRINUSE|address already in use|port is already allocated", plain: "Another program is using that port.", fix: "Stop the other program, or change the port number in your settings."}
  - {id: permission-denied, match: "EACCES|permission denied", plain: "Your user is not allowed to do that in this folder.", fix: "Do not use sudo to force it. Check you are in your own project folder; fix folder ownership if needed."}
  - {id: git-identity, match: "Please tell me who you are|unable to auto-detect email address", plain: "Git needs your name and email to label your commits.", fix: "Run the two git config commands shown in the message with your own name and email."}
  - {id: module-not-found, match: "Cannot find module|Module not found", plain: "A library your code needs is missing or its name is wrong.", fix: "Run the install command again. If it still fails, check the name in the official docs. The AI may have invented it."}
  - {id: package-404, match: "404 Not Found - GET https://registry.npmjs.org|No matching distribution found", plain: "The package name does not exist, or is misspelled. AI tools sometimes invent names.", fix: "Do not retry with guesses. Look the library up in its official documentation and use the exact name."}
  - {id: connection-refused, match: "ECONNREFUSED|connection refused", plain: "Nothing is listening at that address yet.", fix: "Start the service (for example the database container), wait ten seconds, and retry."}
  - {id: too-many-connections, match: "too many connections|remaining connection slots are reserved", plain: "Your app opened more database connections than the database allows.", fix: "Use the provider's pooled connection string for serverless code."}
  - {id: env-undefined, match: "undefined.*process.env|Missing required environment variable|is not defined in the environment", plain: "A setting the app needs was not provided here.", fix: "Compare .env.example with your .env and with the host's settings; add the missing name."}
  - {id: build-failed, match: "Build failed|exit code 1.*build", plain: "The host could not build your project.", fix: "Open the build log, find the first red error line, and copy that line with the one above it to your AI."}
  - {id: http-404-live, match: "404 on the live site|page not found after deploy", plain: "The host is serving the wrong folder or the framework setting is wrong.", fix: "Check the framework preset and output folder in the host settings."}
  - {id: rls-all-rows, match: "all rows returned when logged out", plain: "Your access rules are missing or off, so anyone can read the data.", fix: "Turn rules on for that table, write an ownership rule, and rerun the access check."}
  - {id: secret-committed, match: "gitleaks|secret detected|leaks found", plain: "The scanner found something that looks like a secret in your change.", fix: "Remove it from the file, move it to .env, and if it was ever pushed, replace the secret with a new one at the provider."}
  - {id: free-tier-paused, match: "database is paused|project paused|inactive", plain: "Free plans pause idle projects.", fix: "Resume it in the provider's dashboard, and set an uptime alert so you hear about it first."}
  - {id: windows-path, match: "The system cannot find the path specified|ENOENT.*\\\\", plain: "A file or folder path is wrong, often a Unix command run in Windows.", fix: "Use PowerShell or WSL, and use the Windows version of the command shown in the card."}
  - {id: ota-bricked, match: "device does not boot after update|boot loop", plain: "The update left the device unable to start.", fix: "Use the recovery or fallback image if one exists. If not, a physical recovery is needed. Record it in fault-tests.md and fix the update design before the next release."}
