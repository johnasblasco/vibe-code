schema: failure-modes/v1
entries:
  - {id: AI-01, title: "AI installs a package that does not exist or that an attacker registered under an invented name", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Unknown package in the lockfile; malware runs at install or build.", cause: "Models invent package names, often the same ones repeatedly, and attackers register them. A name that exists is not proof it is safe.", prevention: {questions: [aic.dependency_policy, aic.dependency_checks, sx.lockfile_scripts, sec.dependencies], templates: [project/AGENTS.md.tmpl], skills: [scaffolder-builder]}, detection: "Every new dependency is checked against official docs, publisher, age, and repository; lockfile reviewed in each diff.", evidence: researched, source: "https://labs.cloudsecurityalliance.org/research/csa-research-note-slopsquatting-ai-supply-chain-20260419-csa/"}
  - {id: AI-02, title: "Invented agent skill, plugin, or tool dependency spreads", severity: 5, likelihood: 2, applies_when: "otherwise", symptom: "A skill or config references a package or repository nobody vetted; hidden instructions run in your agent.", cause: "Skill files generated or copied without review; the same invented name reused across repositories.", prevention: {questions: [aic.skills_policy, aic.dependency_policy], skills: [knowledge-pack-maintenance]}, detection: "Read every SKILL.md and script before install; pin versions; install per project.", evidence: researched, source: "https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/07/CSA_research_note_hallusquatting_ai_hallucinated_packages_20260712-csa-styled.pdf"}
  - {id: AI-03, title: "AI uses outdated or invented APIs", severity: 3, likelihood: 5, applies_when: "otherwise", symptom: "Code compiles in the AI's head but not in your project.", cause: "Training data is older than the library version in use.", prevention: {questions: [aic.docs_sources, aic.test_first, res.runtime_support], packs: [tool-versions]}, detection: "Tests fail early; docs sources listed in AGENTS.md.", evidence: practice}
  - {id: AI-04, title: "AI contradicts earlier decisions (drift)", severity: 3, likelihood: 5, applies_when: "otherwise", symptom: "Two auth systems, two styles, duplicated logic.", cause: "Each session starts without the earlier reasoning.", prevention: {questions: [arch.decisions_log, aic.conventions, aic.drift_check], templates: [project/AGENTS.md.tmpl, project/docs/decisions/0000-template.md]}, detection: "Decisions log reviewed at each milestone.", evidence: practice}
  - {id: AI-05, title: "AI makes a large unreviewed change or deletes files", severity: 4, likelihood: 3, applies_when: "otherwise", symptom: "Hundreds of changed files, lost work.", cause: "Too much autonomy, no checkpoints.", prevention: {questions: [aic.autonomy, aic.always_ask, aic.commit_cadence, aic.diff_review, team.branching]}, detection: "Small commits; protected main; diffs read.", evidence: practice}
  - {id: AI-06, title: "Secrets or customer data pasted into AI chats", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Private data stored in third-party logs.", cause: "Pasting errors or dumps for help.", prevention: {questions: [aic.no_secrets_in_prompts, dl.test_data], cards: [git.secret_scanner]}, detection: "Redaction in the stuck command; policy in AGENTS.md.", evidence: practice}
  - {id: AI-07, title: "AI runs commands against production", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Real data changed from a development session.", cause: "Production credentials available locally.", prevention: {questions: [aic.production_guard, aic.always_ask], skills: [db-migration-rules, deploy-checklist]}, detection: "No production credentials on developer machines.", evidence: practice}
  - {id: AI-08, title: "Tests written to pass instead of to check", severity: 3, likelihood: 4, applies_when: "otherwise", symptom: "Green checks but broken behavior.", cause: "AI edits tests or asserts what the code already does.", prevention: {questions: [aic.test_first, qa.levels, aic.diff_review]}, detection: "Tests fail first, then pass after the change.", evidence: practice}
  - {id: AI-09, title: "AI claims something works without verifying", severity: 3, likelihood: 4, applies_when: "otherwise", symptom: "Reports of success that are false.", cause: "No required evidence.", prevention: {questions: [aic.done, aic.test_first], cards: [deploy.hello_world]}, detection: "Done means command output, not a statement.", evidence: practice}
