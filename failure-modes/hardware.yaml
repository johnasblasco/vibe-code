schema: failure-modes/v1
entries:
  - {id: HW-01, title: "Interrupted update bricks the device", severity: 5, likelihood: 4, applies_when: "physical or radio", symptom: "Units stop booting after an update; recovery needs a physical visit.", cause: "Update writes over the running firmware; power or network drops mid-write.", prevention: {questions: [hw.fw.bootloader, hw.fw.confirm_boot, hw.ops.update_testing, hw.fw.update_preconditions, hw.ops.ota_rollout]}, detection: "Cut power at 10, 50, and 90 percent of a write in the test rig.", evidence: researched, source: "https://hubble.com/community/guides/why-ota-updates-fail-in-production-and-how-to-fix-them/"}
  - {id: HW-02, title: "Update marked successful before it actually runs", severity: 5, likelihood: 3, applies_when: "physical or radio", symptom: "Bad firmware becomes permanent.", cause: "Flash write treated as success; no post-boot health check.", prevention: {questions: [hw.fw.confirm_boot, hw.fw.bootloader]}, detection: "Boot a deliberately broken image and confirm automatic rollback.", evidence: researched, source: "https://www.bytesnap.com/news-blog/how-to-design-secure-ota-firmware-updates/"}
  - {id: HW-03, title: "Update bigger than free flash", severity: 4, likelihood: 4, applies_when: "physical or radio", symptom: "Updates fail silently or corrupt memory later in the product life.", cause: "No headroom for a second image as firmware grows.", prevention: {questions: [hw.plat.memory, hw.plat.mcu]}, detection: "Track image size against flash budget in CI.", evidence: researched, source: "https://memfault.com/blog/ota-testing-101-the-ultimate-guide/"}
  - {id: HW-04, title: "Firmware flashed to an incompatible hardware revision", severity: 4, likelihood: 3, applies_when: "physical or radio", symptom: "Part of the fleet misbehaves after an update.", cause: "Board revisions use different parts but get the same image.", prevention: {questions: [hw.mfg.variants, hw.mfg.bom]}, detection: "Update refuses a mismatched revision ID.", evidence: researched, source: "https://hubble.com/community/guides/why-ota-updates-fail-in-production-and-how-to-fix-them/"}
  - {id: HW-05, title: "Settings or calibration overwritten by an update", severity: 4, likelihood: 3, applies_when: "physical or radio", symptom: "Devices lose Wi-Fi settings or calibration after updating.", cause: "Config stored in the firmware partition.", prevention: {questions: [hw.fw.config_storage, hw.design.calibration]}, detection: "Update test checks that settings survive.", evidence: researched, source: "https://hubble.com/community/guides/why-ota-updates-fail-in-production-and-how-to-fix-them/"}
  - {id: HW-06, title: "Expired certificate ends all future updates", severity: 5, likelihood: 3, applies_when: "radio", symptom: "Devices can no longer connect or update.", cause: "No certificate renewal plan; wrong clock.", prevention: {questions: [hw.sec.cert_lifecycle, hw.fw.time]}, detection: "Calendar of expiry dates and a test with an expired certificate.", evidence: researched, source: "https://www.bytesnap.com/news-blog/how-to-design-secure-ota-firmware-updates/"}
  - {id: HW-07, title: "Flash wears out on aged devices", severity: 4, likelihood: 3, applies_when: "physical or radio", symptom: "Failures appear after months or years, not in the lab.", cause: "Frequent logging or state writes; update pressure on old flash.", prevention: {questions: [hw.fw.flash_endurance, hw.fw.logging]}, detection: "Write-cycle budget calculated for the product lifetime.", evidence: researched, source: "https://www.tuxera.com/blog/ota-update-failures-vehicles-storage-risks/"}
  - {id: HW-08, title: "Debug port left open", severity: 5, likelihood: 3, applies_when: "physical or radio", symptom: "Firmware and keys can be read or replaced.", cause: "Development setting shipped.", prevention: {questions: [hw.plat.debug_ports, hw.env.tamper, hw.sec.key_storage]}, detection: "Production unit audit confirms debug access is disabled.", evidence: researched, source: "https://skillselion.com/skills/404kidwiz/claude-supercode-skills/embedded-systems"}
  - {id: HW-09, title: "Shared default password or key on every unit", severity: 5, likelihood: 3, applies_when: "radio", symptom: "One leak compromises the whole fleet.", cause: "Same credential in firmware.", prevention: {questions: [hw.sec.default_creds, hw.cloud.identity, hw.cloud.provisioning]}, detection: "Two units never share a credential.", evidence: researched, source: "https://www.etsi.org/technologies/consumer-iot-security"}
  - {id: HW-10, title: "Certification failure after tooling is committed", severity: 5, likelihood: 4, applies_when: "radio or mains or battery", symptom: "Product cannot be sold; redesign needed.", cause: "Radio, EMC, safety, or battery rules checked after layout.", prevention: {questions: [hw.plat.radio_approach, hw.reg.markets, hw.reg.radio, hw.reg.emc, hw.reg.lab, hw.design.emc_esd, hw.design.antenna]}, detection: "Pre-compliance testing on prototypes before design freeze.", evidence: researched, source: "https://predictabledesigns.com/how-long-it-really-takes-to-certify-your-product/"}
  - {id: HW-11, title: "Single-source part shortage or end of life", severity: 4, likelihood: 4, applies_when: "physical or radio", symptom: "Production stops or the board must be redesigned.", cause: "No second source or lifecycle tracking.", prevention: {questions: [hw.mfg.bom, hw.mfg.lifecycle, hw.mfg.counterfeit]}, detection: "Bill-of-materials risk review every quarter.", evidence: practice}
  - {id: HW-12, title: "Software crash leaves a hazard active (pump or heater stays on)", severity: 5, likelihood: 3, applies_when: "actuator", symptom: "Flood, overheating, injury.", cause: "Safety depends only on software.", prevention: {questions: [hw.safe.failsafe, hw.safe.interlock, hw.safe.thermal_electrical, hw.design.power_protection], skills: [hardware-facts, iot-hardware-intake]}, detection: "Pull the controller's power and kill the process; the device reaches its safe state.", evidence: practice}
  - {id: HW-13, title: "AI invents pins, registers, or timings", severity: 5, likelihood: 4, applies_when: "physical or radio", symptom: "Damaged board or intermittent faults.", cause: "No source of truth for the hardware.", prevention: {questions: [hw.ver.hardware_facts], skills: [hardware-facts, iot-hardware-intake], templates: [hardware/docs-hardware-README.md.tmpl]}, detection: "Every pin and register cited to a file in docs/hardware/.", evidence: practice}
  - {id: HW-14, title: "Battery shipping or approval blocks the launch", severity: 4, likelihood: 3, applies_when: "battery", symptom: "Shipments held; extra testing months.", cause: "Lithium transport and cell approvals started late.", prevention: {questions: [hw.reg.battery, hw.mfg.logistics, hw.plat.power_source]}, detection: "Transport test report in hand before the first shipment.", evidence: researched, source: "https://www.fictiv.com/?p=1151"}
  - {id: HW-15, title: "Fleet misbehaves when your cloud is down", severity: 4, likelihood: 3, applies_when: "radio", symptom: "Devices stop working or flood the server on recovery.", cause: "No offline behavior or retry backoff.", prevention: {questions: [hw.net.offline, hw.ops.resilience, hw.cloud.broker]}, detection: "Disconnect the cloud in a test for 24 hours.", evidence: practice}
  - {id: HW-16, title: "Vulnerability reporting deadline missed", severity: 4, likelihood: 3, applies_when: "radio and hw.reg.markets contains 'EU'", symptom: "Legal exposure after an exploited vulnerability.", cause: "No owner or process for the required staged reports.", prevention: {questions: [hw.sec.reporting, hw.ops.vuln_process, hw.sec.vuln_intake, hw.sec.cra_category], packs: [eu-cra]}, detection: "A dry run of an incident report.", evidence: researched, source: "https://ncsc.gov.ie/cra/"}
  - {id: HW-17, title: "Provisioning keys leak at the factory", severity: 5, likelihood: 2, applies_when: "radio", symptom: "Attacker can clone devices.", cause: "Keys handled in plain files by a contract manufacturer.", prevention: {questions: [hw.mfg.programming, hw.cloud.provisioning, hw.plat.secure_element]}, detection: "Key injection audit with the manufacturer.", evidence: practice}
  - {id: HW-18, title: "Open-source licence conditions ignored in firmware", severity: 3, likelihood: 3, applies_when: "physical or radio", symptom: "Legal demand to release source or stop selling.", cause: "Libraries added without tracking licences.", prevention: {questions: [hw.reg.oss_licenses, hw.sec.sbom]}, detection: "Component list with licences generated at each release.", evidence: practice}
  - {id: HW-19, title: "Export rules for encryption ignored", severity: 3, likelihood: 2, applies_when: "radio", symptom: "Shipment detained or legal trouble.", cause: "Encryption assumed to be unrestricted.", prevention: {questions: [hw.reg.export_control]}, detection: "Written classification from an advisor.", evidence: practice}
  - {id: HW-20, title: "Missing labels, marks, or manual in a target market", severity: 3, likelihood: 4, applies_when: "physical", symptom: "Customs or retailers reject the product.", cause: "Documentation treated as an afterthought.", prevention: {questions: [hw.reg.labeling_docs, hw.reg.eol_notice]}, detection: "Document checklist per market before production.", evidence: practice}
  - {id: HW-21, title: "Prototype results do not carry over to the production board", severity: 4, likelihood: 4, applies_when: "physical", symptom: "Works on the bench, fails in the factory or field.", cause: "Dev boards, jumper wires, and ideal power differ from production.", prevention: {questions: [hw.design.prototype_gap, hw.design.dfm_dft, hw.mfg.stages, hw.ver.reliability_tests]}, detection: "EVT, DVT, and PVT builds each pass defined tests.", evidence: researched, source: "https://hubble.com/community/guides/how-to-test-iot-hardware-before-mass-production/"}
  - {id: HW-22, title: "No visibility into problems in the field", severity: 3, likelihood: 4, applies_when: "radio", symptom: "Returns and complaints with no data.", cause: "No telemetry or crash reports.", prevention: {questions: [hw.ver.field_telemetry, hw.cloud.telemetry, hw.fw.logging]}, detection: "Crash and reboot counters reach the dashboard.", evidence: practice}
  - {id: HW-23, title: "Sensor drift makes data wrong over time", severity: 3, likelihood: 3, applies_when: "physical", symptom: "Slowly worsening readings.", cause: "No calibration or drift plan.", prevention: {questions: [hw.design.calibration]}, detection: "Reference comparison on aged units.", evidence: practice}
  - {id: HW-24, title: "Serious-injury product built without qualified safety engineering", severity: 5, likelihood: 2, applies_when: "harm_possible in ['serious_injury', 'death']", symptom: "Harm, recall, liability.", cause: "No hazard analysis, no standard, no independent review.", prevention: {questions: [sc.domain, sc.classification, sc.hazards, sc.independent_review, hw.safe.expert, hw.safe.standard], skills: [iot-hardware-intake]}, detection: "Stop rule C-011 and an expert brief.", evidence: researched, source: "https://technav.ieee.org/topic/software-safety/"}
