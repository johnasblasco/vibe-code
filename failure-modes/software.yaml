schema: failure-modes/v1
entries:
  - {id: SW-01, title: "Database answers anyone (row-level security off or missing)", severity: 5, likelihood: 5, applies_when: "user_accounts", symptom: "Anyone can read or change other people's data; discovered after a leak.", cause: "Tables made in SQL have row-level security off by default; AI code often skips ownership rules.", prevention: {questions: [sec.access_test, auth.roles, features.multi_tenant], cards: [access.own_data_only], skills: [vibe-coding-security-baseline]}, detection: "Logged-out request and other-user request both return zero rows.", evidence: researched, source: "https://pub.towardsai.net/vibe-coding-security-checklist-12-checks-you-should-actually-run-2026-e0d98ec83db1"}
  - {id: SW-02, title: "Secret committed to git", severity: 5, likelihood: 5, applies_when: "otherwise", symptom: "Keys appear in a public repository or are used by strangers; surprise bills or breaches.", cause: "No .gitignore before the first secret; AI tools write keys inline; AI-assisted commits leak secrets about twice as often.", prevention: {questions: [sec.secrets, aic.no_secrets_in_prompts], cards: [git.init_ignore, git.secret_scanner], templates: [project/.gitignore.tmpl, project/.pre-commit-config.yaml.tmpl]}, detection: "Fake-secret commit is blocked; scanner runs in CI.", evidence: researched, source: "https://bolster.ai/?p=13306"}
  - {id: SW-03, title: "Secret key shipped to the browser", severity: 5, likelihood: 4, applies_when: "otherwise", symptom: "Service or admin key visible in page source.", cause: "Wrong public-prefix on an environment variable, or the privileged key used in client code.", prevention: {questions: [sec.secrets], cards: [env.config_secrets, access.own_data_only]}, detection: "Search built browser files for secret strings.", evidence: researched, source: "https://pub.towardsai.net/vibe-coding-security-checklist-12-checks-you-should-actually-run-2026-e0d98ec83db1"}
  - {id: SW-04, title: "API route with no login or ownership check", severity: 5, likelihood: 4, applies_when: "user_accounts", symptom: "Direct calls to the API return or change data without logging in.", cause: "Security only added in the UI.", prevention: {questions: [sec.threat_model, auth.roles, sec.access_test], cards: [access.own_data_only], skills: [vibe-coding-security-baseline]}, detection: "Call every route with no token and with another user's token.", evidence: researched, source: "https://www.questera.ai/blogs/is-vibe-coding-safe-security-risks-ai-generated-apps"}
  - {id: SW-05, title: "Unverified webhook", severity: 4, likelihood: 3, applies_when: "money or int.webhooks", symptom: "Fake payment or event messages accepted.", cause: "Handler trusts the request without checking the signature.", prevention: {questions: [int.webhooks, pay.webhooks]}, detection: "Send a forged webhook in a test.", evidence: practice}
  - {id: SW-06, title: "Free-tier database pauses and looks like an outage", severity: 3, likelihood: 4, applies_when: "product.budget == 'free_only'", symptom: "Site errors after a quiet week.", cause: "Providers pause idle free projects.", prevention: {questions: [data.host, run.uptime], cards: [db.setup_hosted], packs: [free-database-tiers]}, detection: "Uptime alert and a documented wake-up step.", evidence: researched, source: "https://www.itpathsolutions.com/supabase-free-tier-limits"}
  - {id: SW-07, title: "Database connection exhaustion from serverless", severity: 4, likelihood: 4, applies_when: "be.hosting_model == 'serverless' or data.pooling", symptom: "Random 'too many connections' errors under light load.", cause: "Each function instance opens its own connection.", prevention: {questions: [data.pooling], cards: [db.setup_hosted]}, detection: "Load test with concurrent requests.", evidence: researched, source: "https://jeangalea.com/beyond-shared-mysql/"}
  - {id: SW-08, title: "Local app connected to the production database", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Test data or a bad migration hits real users.", cause: "One .env copied everywhere.", prevention: {questions: [aic.production_guard, ops.environments], cards: [db.setup_local, env.config_secrets], skills: [db-migration-rules]}, detection: "Local .env must not contain the production connection string.", evidence: practice}
  - {id: SW-09, title: "Destructive migration run on production", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Tables or columns vanish.", cause: "AI or user runs a drop or type change without a backup.", prevention: {questions: [ops.prod_migrations, data.migrations, aic.always_ask], skills: [db-migration-rules]}, detection: "Review migration for drops; require backup before apply.", evidence: practice}
  - {id: SW-10, title: "Backup never restored", severity: 5, likelihood: 4, applies_when: "otherwise", symptom: "Restore fails when it is needed.", cause: "Backups were turned on but never tested.", prevention: {questions: [data.backups, run.restore_test, res.rpo_rto], cards: [db.backups]}, detection: "Row counts match after a test restore.", evidence: practice}
  - {id: SW-11, title: "First deploy discovered the problems late", severity: 3, likelihood: 5, applies_when: "otherwise", symptom: "Weeks of work will not build or run in production.", cause: "Deploy left to the end.", prevention: {questions: [plan.first_slice], cards: [deploy.hello_world]}, detection: "A live URL exists before the first feature.", evidence: practice}
  - {id: SW-12, title: "Missing environment variable in production", severity: 3, likelihood: 5, applies_when: "otherwise", symptom: "Works locally, fails after deploy.", cause: "Variables exist only in the local .env.", prevention: {questions: [ops.config], cards: [env.config_secrets], templates: [project/.env.example.tmpl]}, detection: "Startup check stops the app with a clear message.", evidence: practice}
  - {id: SW-13, title: "Open CORS with credentials", severity: 4, likelihood: 3, applies_when: "otherwise", symptom: "Other sites can call the API as the logged-in user.", cause: "Wildcard origin set to silence an error.", prevention: {questions: [sec.headers_cors, sx.csrf]}, detection: "Call the API from an unlisted origin.", evidence: practice}
  - {id: SW-14, title: "AI usage cost runaway", severity: 4, likelihood: 4, applies_when: "ai_decisions or int.ai_provider", symptom: "A large bill after a loop, a viral day, or abuse.", cause: "No per-user or global cap.", prevention: {questions: [ai.cost_caps, sec.rate_limits, ops.cost_alerts, int.ai_provider]}, detection: "Spend alert and hard cap tested.", evidence: practice}
  - {id: SW-15, title: "Prompt injection through outside text", severity: 5, likelihood: 3, applies_when: "ai_decisions", symptom: "A web page, email, or upload makes the model leak data or act.", cause: "Model reads untrusted text with powerful tools.", prevention: {questions: [ai.untrusted_input, ai.tools, ai.approval, ai.scope]}, detection: "Test with planted instructions in sample inputs.", evidence: researched, source: "https://www.cybersaint.io/cybersecurity-frameworks-and-standards/glossary/what-is-the-owasp-top-10-for-llm-and-agentic-ai"}
  - {id: SW-16, title: "Agent has more permissions than needed", severity: 5, likelihood: 3, applies_when: "ai_decisions", symptom: "One mistake deletes data or sends messages.", cause: "Broad tool access for convenience.", prevention: {questions: [ai.tools, ai.approval, ai.scope]}, detection: "List each tool and the least access it needs.", evidence: researched, source: "https://cycode.com/blog/owasp-top-10-llm-applications/"}
  - {id: SW-17, title: "Double charge or replayed payment event", severity: 4, likelihood: 3, applies_when: "money", symptom: "Customers charged twice or credited wrongly.", cause: "Handlers not safe to run twice; no idempotency.", prevention: {questions: [pay.webhooks, pay.refunds, pay.fraud]}, detection: "Replay the same event in a test.", evidence: practice}
  - {id: SW-18, title: "Malicious or oversized upload", severity: 4, likelihood: 3, applies_when: "features.extras contains 'file_uploads'", symptom: "Server filled, malware stored, or script served from your domain.", cause: "No type, size, or content checks.", prevention: {questions: [sec.uploads, data.files]}, detection: "Upload wrong types and huge files in tests.", evidence: practice}
  - {id: SW-19, title: "No error visibility", severity: 3, likelihood: 5, applies_when: "otherwise", symptom: "You learn about breakage from users.", cause: "No error tracking or uptime alert.", prevention: {questions: [run.errors, run.uptime]}, detection: "Trigger a deliberate error and a stopped site.", evidence: practice}
  - {id: SW-20, title: "CI pipeline hijacked through unpinned actions or broad token", severity: 4, likelihood: 3, applies_when: "otherwise", symptom: "Secrets printed in logs or code pushed by an attacker.", cause: "Actions referenced by movable tags; token with write access everywhere, or changed official lookup data replacing a previously reviewed release hash.", prevention: {questions: [sx.ci_security, ops.ci], templates: [project/.github/workflows/ci.yml.tmpl]}, detection: "Every action pinned to a full commit hash; permissions start empty. Refuse mismatched commit evidence and movement of an already reviewed release tag; see tests/security-scenarios/cli-hardening.yaml.", evidence: researched, source: "https://orca.security/resources/blog/github-actions-hardening/"}
  - {id: SW-31, title: "CLI repeats whole-bank work for every suggested answer", severity: 3, likelihood: 2, applies_when: "product.platform == 'cli'", symptom: "An interview becomes slow and unchanged validation tests hit their existing timeouts.", cause: "Every proposal clones and validates the complete state on every queue iteration, even though only that candidate needs checking.", prevention: {questions: [aic.test_first, qa.levels, aic.done], skills: [scaffolder-builder]}, detection: "Validate proposal eligibility with the same current question type, option, allowed-state and secret rules, without accepting it. Keep full state validation and awaited saving on actual acceptance. Run unchanged interview/cancellation/persistence tests and tests/unit/proposal-validation.test.ts; fixture in tests/security-scenarios/cli-hardening.yaml.", evidence: practice}
  - {id: SW-21, title: "Hosting or registry account takeover (no 2FA)", severity: 5, likelihood: 3, applies_when: "otherwise", symptom: "Attacker controls your app or your published package.", cause: "Reused passwords, no second factor.", prevention: {questions: [team.access, pkg.registry], cards: [env.accounts_2fa]}, detection: "Manual attestation recorded.", evidence: practice}
  - {id: SW-22, title: "Building the wrong thing", severity: 4, likelihood: 4, applies_when: "otherwise", symptom: "Launched and nobody uses it.", cause: "No test of the riskiest assumption before building.", prevention: {questions: [val.riskiest_assumption, val.evidence, val.success_metric, val.alternatives]}, detection: "A written assumption with a cheap test and a date.", evidence: practice}
  - {id: SW-23, title: "Costs more per user than it earns", severity: 3, likelihood: 3, applies_when: "money or ai_decisions", symptom: "Growth increases losses.", cause: "No unit economics.", prevention: {questions: [val.unit_economics, ai.cost_caps]}, detection: "Cost per active user written down.", evidence: practice}
  - {id: SW-24, title: "No way to delete or export a user's data", severity: 3, likelihood: 3, applies_when: "user_accounts and sensitive_data", symptom: "Legal request cannot be met.", cause: "Deletion not designed in.", prevention: {questions: [auth.deletion, dl.subject_requests, dl.retention, legal.regulations]}, detection: "Delete a test user end to end.", evidence: practice}
  - {id: SW-25, title: "Runtime or framework version out of security support", severity: 3, likelihood: 4, applies_when: "otherwise", symptom: "Known vulnerabilities with no patch.", cause: "Support windows move; old tutorials and AI suggest old versions.", prevention: {questions: [res.runtime_support, sec.dependencies, res.dependency_health], packs: [tool-versions]}, detection: "CI fails on end-of-life runtime versions.", evidence: researched, source: "https://ecorpit.com/nodejs-development-company/"}
  - {id: SW-26, title: "Single point of vendor failure", severity: 3, likelihood: 3, applies_when: "otherwise", symptom: "A provider outage, price change, or shutdown stops the product.", cause: "No exit plan; free tiers disappear.", prevention: {questions: [res.vendor_exit, res.third_party_down, dl.import_export], packs: [free-database-tiers]}, detection: "Written exit plan reviewed twice a year.", evidence: researched, source: "https://swyftstack.com/blog/free-postgresql-hosting"}
  - {id: SW-27, title: "Server fetches attacker-chosen URL (SSRF)", severity: 4, likelihood: 2, applies_when: "otherwise", symptom: "Internal services or cloud credentials reachable through your server.", cause: "Fetching user-supplied URLs without restrictions, or overlooking non-global IPv6 DNS answers.", prevention: {questions: [sx.ssrf, be.validation]}, detection: "Try internal and non-global DNS answers, including IPv6 benchmarking and documentation addresses. Reject mixed public/non-global results before HTTPS; see tests/security-scenarios/cli-hardening.yaml.", evidence: practice}
  - {id: SW-28, title: "Admin area exposed or unlogged", severity: 4, likelihood: 3, applies_when: "otherwise", symptom: "An attacker or mistaken staff member changes everything.", cause: "Admin routes protected by hidden URL only.", prevention: {questions: [sx.admin, auth.roles, sec.audit_log]}, detection: "Admin routes require role checks and write audit entries.", evidence: practice}
  - {id: SW-29, title: "CLI retains handlers or temporary resources after a failed operation", severity: 3, likelihood: 2, applies_when: "product.platform == 'cli'", symptom: "Repeated commands retain signal handlers, hang after cancellation, or leave probe files behind.", cause: "Initialization awaits happen outside cleanup scope, or error paths do not release owned resources.", prevention: {questions: [aic.test_first, qa.levels, pkg.platforms], skills: [scaffolder-builder]}, detection: "Compare signal-listener counts before and after corrupt-state errors; exercise cancellation and owned cleanup. See tests/security-scenarios/doctor-integrity.yaml and the native doctor tests.", evidence: practice}
  - {id: SW-30, title: "CLI trusts changed instruction assets without an integrity check", severity: 4, likelihood: 2, applies_when: "product.platform == 'cli'", symptom: "A changed knowledge pack or template silently alters guidance or generated code.", cause: "Valid syntax is mistaken for trusted content, or a checked template is read again after replacement.", prevention: {questions: [aic.skills_policy, sx.lockfile_scripts, aic.diff_review], skills: [scaffolder-builder]}, detection: "Corrupt packs/templates in a disposable copy and require refusal before prompts, writes or commands. Check complete reviewed hashes and use the verified snapshot; see tests/security-scenarios/cli-hardening.yaml and tests/unit/asset-integrity.test.ts. Review actual source diffs before explicitly refreshing the inventory.", evidence: practice}
