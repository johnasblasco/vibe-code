schema: knowledge-pack/v1
id: tool-versions
title: Runtime and tool versions used by generated files
last_verified: 2026-10-31
max_age_days: 14
volatile: true
verified_via: search of Node.js release-schedule coverage and the Node.js announcement of the new release model; other values deliberately left empty
facts:
  - "Node.js 26 entered Active LTS on 2026-10-28 and is supported to April 2029. Node.js 24 is in maintenance LTS, supported to 2028-04-30. Node.js 22 reaches end of life on 2027-04-30. Node.js 20 and 25 no longer receive patches."
  - "From Node.js 27 the project ships one major release a year (April), promotes it to LTS in October, and every release becomes LTS. Version numbers follow the calendar year."
  - "Pin base container images to a major line, never to latest, so a rebuild cannot silently jump a major version."
  - "Pin CI actions to full commit hashes, not version tags. Tags can be moved after an account compromise."
values:
  node: {recommended_major: 26, previous_lts_major: 24, minimum_supported_major: 24}
  postgres: {image_tag: null, note: "Look up the current supported major at scaffold time from the official release page."}
  redis_or_valkey: {image_tag: null, note: "Look up at scaffold time; check licence terms before choosing."}
  gitleaks: {rev: null, note: "Resolve the latest release tag at scaffold time and pin it."}
resolution_policy: "The CLI fills null values by querying the official registry or release page when generating files, shows the lookup date, and refuses to generate files with unresolved values unless the user accepts a floating default and the choice is logged."
affects_questions: [res.runtime_support, sec.dependencies]
sources:
  - https://fireup.pro/news/nodejs-26-lts-whats-new-upgrade
  - https://ecorpit.com/nodejs-development-company/
  - https://dev.to/mr_manushukla/one-nodejs-release-a-year-from-2027-what-the-node-27-lts-change-means-for-your-upgrade-cadence-2fo3
  - https://orca.security/resources/blog/github-actions-hardening/
primary_source_todo: "Confirm Node.js dates on nodejs.org/en/about/previous-releases and the official release schedule repository."
