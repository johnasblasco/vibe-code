schema: knowledge-pack/v1
id: tool-versions
title: Runtime and tool versions used by generated files
last_verified: 2026-11-01
max_age_days: 14
volatile: true
verified_via: "Generation pins checked against official Node release metadata, Docker Official Images publication manifests, and official GitHub release commit links on 2026-11-01. Lifecycle prose below remains secondary-source research and is not used for generation."
facts:
  - "Node.js 26 entered Active LTS on 2026-10-28 and is supported to April 2029. Node.js 24 is in maintenance LTS, supported to 2028-04-30. Node.js 22 reaches end of life on 2027-04-30. Node.js 20 and 25 no longer receive patches."
  - "From Node.js 27 the project ships one major release a year (April), promotes it to LTS in October, and every release becomes LTS. Version numbers follow the calendar year."
  - "Pin base container images to a major line, never to latest, so a rebuild cannot silently jump a major version."
  - "Pin CI actions to full commit hashes, not version tags. Tags can be moved after an account compromise."
values:
  node: {recommended_major: 26, recommended_version: 26.13.0, previous_lts_major: 24, minimum_supported_major: 24}
  postgres: {image_tag: '18.6', volume_target: /var/lib/postgresql, note: "Official image manifest publishes 18.6; 19rc1 is excluded. PostgreSQL 18+ mounts /var/lib/postgresql."}
  redis_or_valkey: {image_tag: '8.10.3', note: "Redis is the existing template choice, not Valkey. Review the official licence terms before adoption.", licence_source: 'https://redis.io/legal/licenses/'}
  gitleaks: {rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e, tag: v8.30.1}
  actions:
    checkout: {sha: 3d3c42e5aac5ba805825da76410c181273ba90b1, tag: v7.0.1}
    setup_node: {sha: 949feb2413d6458794dcd2491c4babbbce0c15c1, tag: v7.1.0}
