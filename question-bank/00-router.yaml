# Routing facts determine tiers and modules. The guided interview groups them after the project introduction.
schema: question-bank/v1
module: router
flags:
  - {id: user_accounts, ask: "Will people log in to it?", type: boolean, covers: [asvs:authentication]}
  - {id: physical, ask: "Does it touch the physical world (sensors, motors, pumps, lights, locks)?", type: boolean, covers: [hardware:physical-context]}
  - {id: radio, ask: "Does it use radio (Wi-Fi, Bluetooth, cellular, LoRa, Zigbee, Thread)?", type: boolean, ask_when: "physical", covers: [hardware:connectivity]}
  - {id: battery, ask: "Does it run on a battery?", type: boolean, ask_when: "physical", covers: [hardware:power]}
  - {id: mains, ask: "Does it connect to mains power (wall voltage)?", type: boolean, ask_when: "physical", covers: [hardware:power]}
  - {id: actuator, ask: "Does it move or switch something (pump, motor, heater, relay, lock)?", type: boolean, ask_when: "physical", covers: [safety:hazard-analysis]}
  - {id: harm_possible, ask: "Could a failure cause physical harm?", type: single_select, ask_when: "physical or radio or mains or actuator or ai_decisions or product.platform == 'hardware_device'", options: [none, property_damage, minor_injury, serious_injury, death], option_labels: {none: No physical harm, property_damage: Property damage, minor_injury: Minor injury, serious_injury: Serious injury, death: Risk to life}, covers: [iso25010:safety, safety:hazard-analysis]}
  - {id: sensitive_data, ask: "Does it handle personal, children, health, or financial data?", type: boolean, covers: [regulatory:privacy]}
  - {id: money, ask: "Will it take payments or hold balances?", type: boolean, covers: [project:payments]}
  - {id: ai_decisions, ask: "Will an AI model make decisions or take actions for users?", type: boolean, covers: [ai-risk:excessive-agency]}
  - {id: multi_tenant, ask: "Will separate organizations or teams share it?", type: boolean, covers: [asvs:authorization]}
tiers:
  - {id: T5, when: "harm_possible in ['serious_injury', 'death']", adds: [extensions/safety-critical, hardware/*]}
  - {id: T4, when: "physical or radio", adds: [hardware/*]}
  - {id: T3, when: "money or ai_decisions or multi_tenant or sensitive_data", adds: []}
  - {id: T2, when: "user_accounts", adds: [software/03-auth-integrations, software/04-security-quality, software/07-lifecycle-resilience-security-extras]}
  - {id: T1, when: "otherwise", adds: [software/01-product-users-data, software/02-architecture-stack, software/05-delivery-operations-legal-planning, software/06-validation-team-ai-dev, extensions/*]}
rule: "Tiers are cumulative: the project's tier is the first rule that matches (top to bottom), and it loads everything its tier and every lower tier adds. Modules inside loaded files still apply their own load_when and tier_min. Hardware (T4 and above) is never run at depth 'quick'; the engine raises it to 'standard'."
stop_rules:
  - {id: beginner-safety-critical, when: "harm_possible in ['serious_injury', 'death'] and product.team == 'solo_beginner'", action: "stop and generate an expert brief; do not continue alone"}
